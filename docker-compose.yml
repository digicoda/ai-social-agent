services:
  api:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/ai_social_agent.db
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - app-media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/ai_social_agent.db
    command: ["python", "-m", "app.cli", "worker", "--loop"]
    volumes:
      - app-data:/app/data
      - app-media:/app/media

autostart:
  # This key intentionally documents that both services are long-lived.
  # Compose ignores unknown top-level extension-like keys only when prefixed with x-;
  # kept out of the actual Compose model below.
  
volumes:
  app-data:
  app-media:
