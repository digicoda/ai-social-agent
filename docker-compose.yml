services:
  api:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/ai_social_agent.db
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - app-media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)); assert '/system/settings' in d['paths'] and '/dashboard/login' in d['paths']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/ai_social_agent.db
    command: ["python", "-m", "app.cli", "worker", "--loop"]
    volumes:
      - app-data:/app/data
      - app-media:/app/media

volumes:
  app-data:
  app-media:
