ont-size:13px}.hero .btn{background:#fff;color:#1a1622}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.section-head h3{margin:0;font-size:15px}.section-head span{font-size:11px;color:var(--muted)}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}.item-title{font-weight:750;font-size:13px}.item p{font-size:12px;line-height:1.55;color:#555b68;margin:8px 0}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f0f1f5;color:#656a76;font-size:10px;font-weight:800}.badge.good{background:#eafaf2;color:#11895a}.badge.warn{background:#fff5df;color:#a76b00}.badge.bad{background:#ffedf1;color:#c63f5d}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar-right{margin-left:auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#858a95}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:#555a66}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dce3;border-radius:8px;padding:10px 11px;font:inherit;font-size:12px;background:#fff;color:#20222b}.field textarea{min-height:100px;resize:vertical}.field small{display:block;color:#8a8f9a;font-size:10px;margin-top:4px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{border:0;background:transparent;padding:9px 12px;font-size:12px;font-weight:800;color:#777c87;cursor:pointer;white-space:nowrap}.tab.active{color:var(--purple);border-bottom:2px solid var(--purple)}.provider-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.provider{border:1px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;background:#fff}.provider.selected{border-color:var(--purple);box-shadow:0 0 0 2px rgba(124,92,255,.1)}.provider h3{margin:0 0 4px;font-size:14px}.provider p{margin:0;color:var(--muted);font-size:11px}.provider .radio{width:15px;height:15px;border:1px solid #c8cbd3;border-radius:50%;float:right}.provider.selected .radio{border:4px solid var(--purple)}.provider-form{margin-top:13px;padding:14px;background:#f8f8fa;border:1px solid var(--line);border-radius:10px}.model-row{display:flex;gap:8px;align-items:flex-end}.model-row .field{flex:1}.config-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.settings-status{font-size:12px;color:#667085}.settings-status.ok{color:#027a48}.settings-status.error{color:#b42318}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action-card{border:1px solid var(--line);border-radius:12px;padding:16px}.action-card h3{margin:0 0 5px;font-size:15px}.empty{padding:30px;text-align:center;border:1px dashed #ccd0da;border-radius:11px;background:#fafbfc}.empty strong{display:block;margin-bottom:5px}.approval-preview{display:grid;grid-template-columns:1fr 270px;gap:14px}.copybox{background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:13px;font-size:12px;line-height:1.6;white-space:pre-wrap}.media-placeholder{border:1px dashed #cdd1da;border-radius:10px;min-height:140px;display:grid;place-items:center;color:#8a8f9a;font-size:11px;text-align:center;padding:15px}.chart{height:190px;display:flex;align-items:flex-end;gap:12px;padding:14px 4px 24px}.bar{flex:1;background:linear-gradient(to top,#7c5cff,#b3a2ff);border-radius:6px 6px 2px 2px;min-height:12px;position:relative}.bar span{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:9px;color:#858a95}.notice{padding:11px;border-radius:8px;background:#fff5df;color:#875b0a;font-size:12px}.toast{position:fixed;right:24px;bottom:24px;background:#16171c;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:99;font-size:12px}.toast.show{display:block}.modal-backdrop{position:fixed;inset:0;background:#11121699;display:grid;place-items:center;z-index:80}.modal{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#fff;border-radius:13px;padding:20px}.close{float:right;border:0;background:#f0f1f5;border-radius:7px;padding:6px 9px;cursor:pointer}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.main{padding-left:20px;padding-right:20px}.top{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}.search-mini{display:none}}@media(max-width:800px){.side{position:relative;width:100%;height:auto}.shell{display:block}.main{margin-left:0}.profile{display:none}.nav{grid-template-columns:repeat(2,1fr)}.nav-label{display:none}.brand{padding-bottom:12px}.top{position:relative}.grid3,.grid2,.provider-grid,.approval-preview{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:14px}.page-intro{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.grid4{grid-template-columns:1fr}.action-grid{grid-template-columns:1fr}}
</style></head>
<body>
<div id="login" class="hidden" style="min-height:100vh;display:grid;place-items:center;background:#111216"><div style="width:min(400px,92vw);background:#fff;border-radius:14px;padding:28px"><h1 id="authTitle" style="margin:0 0 6px">AI Social Agent</h1><p id="authSubtitle" class="muted">Admin dashboard</p><div id="loginNotice" class="notice hidden"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:18px 0 5px"><button type="button" id="signInTab" class="btn">Sign in</button><button type="button" id="signUpTab" class="btn secondary">Create admin</button></div><form id="loginForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="confirmWrap" class="field hidden"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button id="authSubmit" class="btn" style="width:100%;margin-top:8px">Sign in</button></form></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><span class="brand-mark">✦</span><span>AI Social Agent</span><span class="live"><i>●</i> Live</span></div><div class="nav-group"><div class="nav-label">Workspace</div><nav class="nav"><button data-view="overview">⌂<span>Overview</span></button><button data-view="research">⌕<span>Research</span></button><button data-view="content">▤<span>Content</span></button><button data-view="approval">✓<span>Approval</span></button><button data-view="calendar">◫<span>Calendar</span></button><button data-view="analytics">◒<span>Analytics</span></button></nav></div><div class="nav-group"><div class="nav-label">Workspace</div><nav class="nav"><button data-view="integrations">⌘<span>Integrations</span></button><button data-view="settings">⚙<span>Settings</span></button></nav></div><div class="profile"><div class="avatar">A</div><div class="meta"><strong>Administrator</strong><span>Online</span></div><button id="logout" class="icon-btn" title="Sign out">↪</button></div></aside><main class="main"><header class="top"><div><div id="crumb" class="crumb">Workspace / Overview</div><h1 id="title">Overview</h1></div><div class="top-actions"><input id="globalSearch" class="search-mini" placeholder="Search workspace…"><button class="icon-btn" title="Notifications"><span class="dot"></span>♢</button><button class="btn" onclick="go('content')">+ New Content</button></div></header><section id="content" class="content"></section></main></div><div id="toast" class="toast"></div><div id="modalRoot"></div>
<script>
const configured=__AUTH_CONFIGURED__,authenticated=__AUTHENTICATED__,hasAccount=__HAS_ACCOUNT__;const $=id=>document.getElementById(id);let current='overview',signup=!hasAccount;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}
function showLogin(m=''){ $('app').classList.add('hidden');$('login').classList.remove('hidden');if(m){$('loginNotice').textContent=m;$('loginNotice').classList.remove('hidden')}}function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden')}
function setAuthMode(v,m=''){signup=v;$('authTitle').textContent=v?'Create admin account':'Welcome back';$('authSubtitle').textContent=v?'First-time setup — create your administrator login.':'Sign in to your admin dashboard.';$('authSubmit').textContent=v?'Create account':'Sign in';$('signInTab').className=v?'btn secondary':'btn';$('signUpTab').className=v?'btn':'btn secondary';$('confirmWrap').classList.toggle('hidden',!v);$('confirmPassword').required=v;if(m){$('loginNotice').textContent=m;$('loginNotice').classList.remove('hidden')}else $('loginNotice').classList.add('hidden')}
async function login(e){e.preventDefault();const p=$('password').value;if(signup&&p!==$('confirmPassword').value)return setAuthMode(true,'Passwords do not match.');if(signup&&p.length<8)return setAuthMode(true,'Password must be at least 8 characters.');$('authSubmit').disabled=true;try{const r=await fetch('/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:p})});if(r.ok){showApp();refresh()}else{const d=await r.json().catch(()=>({}));setAuthMode(signup,d.detail||'Invalid credentials.')}}finally{$('authSubmit').disabled=false}}
$('loginForm').addEventListener('submit',login);$('signInTab').onclick=()=>setAuthMode(false);$('signUpTab').onclick=()=>setAuthMode(true);$('logout').onclick=async()=>{await fetch('/dashboard/logout',{method:'POST'});showLogin('Signed out.')};
</script></body></html>
