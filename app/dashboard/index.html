<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Social Agent</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}.side{width:240px;background:#101828;color:#fff;padding:24px 16px}.brand{font-weight:800;font-size:19px;padding:8px 10px 24px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#b9c2d0;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}.main{flex:1;padding:28px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.muted{color:#667085}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:18px}.metric{font-size:28px;font-weight:800;margin-top:8px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:20px;margin-top:20px}.panel h2{margin-top:0;font-size:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid transparent;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600;background:#175cd3;color:#fff}.btn.secondary{background:#eef2f6;color:#344054}.btn.danger{background:#d92d20}.btn.active-mode{background:#175cd3;color:#fff;border-color:#175cd3;box-shadow:0 0 0 2px rgba(23,92,211,.18)}.list{display:grid;gap:10px}.item{border:1px solid #eaecf0;border-radius:10px;padding:14px}.item strong{display:block;margin-bottom:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eaecf0;font-size:13px}input,textarea,select{padding:11px;border:1px solid #d0d5dd;border-radius:8px;width:100%;font:inherit}textarea{min-height:80px;resize:vertical}.hidden{display:none}.login{max-width:420px;margin:12vh auto;background:#fff;padding:30px;border:1px solid #e4e7ec;border-radius:14px}.login h1{margin-top:0}.login label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}.notice{padding:12px;border-radius:8px;background:#fff4e5;color:#8a4b08;margin-bottom:16px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 4px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#f2f4f7;color:#475467}.status.ok{background:#ecfdf3;color:#027a48}.status.next{background:#eff8ff;color:#175cd3}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.help{font-size:12px;color:#667085;margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.provider-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.provider{border:1px solid #eaecf0;border-radius:10px;padding:15px}.toast{position:fixed;right:22px;bottom:22px;background:#101828;color:#fff;padding:12px 16px;border-radius:8px;display:none;max-width:360px}.toast.show{display:block}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.provider-grid{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}.side{width:auto}.main{padding:16px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login hidden">
<h1 id="authTitle">AI Social Agent</h1><p id="authSubtitle" class="muted">Admin dashboard</p><div id="loginNotice" class="notice hidden"></div>
<div class="auth-tabs"><button type="button" id="signInTab" class="btn">Sign in</button><button type="button" id="signUpTab" class="btn secondary">Create admin</button></div>
<form id="loginForm"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div id="confirmWrap" class="hidden"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button id="authSubmit" class="btn" style="margin-top:18px;width:100%">Sign in</button></form>
</div>
<div id="app" class="shell hidden">
<aside class="side"><div class="brand">AI Social Agent</div><nav class="nav"><button data-view="overview" class="active">Overview</button><button data-view="research">Research</button><button data-view="approval">Content Approval</button><button data-view="schedule">Schedules</button><button data-view="history">Publishing History</button><button data-view="system">System</button><button id="logout">Sign out</button></nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Overview</h1><div class="muted">Research, approve, schedule and publish.</div></div><button class="btn secondary" onclick="refresh()">Refresh</button></div><section id="content"></section></main></div><div id="toast" class="toast"></div>
<script>
const configured=__AUTH_CONFIGURED__,authenticated=__AUTHENTICATED__,hasAccount=__HAS_ACCOUNT__;const $=id=>document.getElementById(id);let current='overview',signup=!hasAccount;
function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}
function showLogin(message=''){ $('app').classList.add('hidden');$('login').classList.remove('hidden');if(message){$('loginNotice').textContent=message;$('loginNotice').classList.remove('hidden')}}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden') }
function setAuthMode(v,message=''){signup=v;$('authTitle').textContent=v?'Create admin account':'Welcome back';$('authSubtitle').textContent=v?'First-time setup — create your administrator login.':'Sign in to your admin dashboard.';$('authSubmit').textContent=v?'Create account':'Sign in';$('signInTab').className=v?'btn secondary':'btn active-mode';$('signUpTab').className=v?'btn active-mode':'btn secondary';$('confirmWrap').classList.toggle('hidden',!v);$('confirmPassword').required=v;if(message){$('loginNotice').textContent=message;$('loginNotice').classList.remove('hidden')}else $('loginNotice').classList.add('hidden')}
async function login(e){e.preventDefault();const p=$('password').value;if(signup&&p!==$('confirmPassword').value)return setAuthMode(true,'Passwords do not match.');if(signup&&p.length<8)return setAuthMode(true,'Password must be at least 8 characters.');$('authSubmit').disabled=true;try{const r=await fetch('/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:p})});if(r.ok){showApp();refresh()}else{const d=await r.json().catch(()=>({}));setAuthMode(signup,d.detail||'Invalid credentials.')}}finally{$('authSubmit').disabled=false}}
async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){showLogin('Your session expired.');throw new Error('unauthorized')}if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function render(title,html){$('title').textContent=title;$('content').innerHTML=html}
async function refresh(){try{if(current==='overview'){const [s,q,sc]=await Promise.all([api('/publishing/stats'),api('/approval/queue?limit=5'),api('/schedules?limit=5')]);render('Overview',`<div class="cards"><div class="card"><div class="muted">Published</div><div class="metric">${s.published??0}</div></div><div class="card"><div class="muted">Failed</div><div class="metric">${s.failed??0}</div></div><div class="card"><div class="muted">Pending approval</div><div class="metric">${q.items.length}</div></div><div class="card"><div class="muted">Schedules</div><div class="metric">${sc.items.length}</div></div></div><div class="panel"><h2>Next actions</h2><div class="row"><button class="btn" onclick="runResearch()">Run research</button><button class="btn secondary" onclick="generateContent()">Generate content</button><button class="btn secondary" onclick="current='approval';refresh()">Review approval queue</button></div></div>`)}else if(current==='approval'){const q=await api('/approval/queue?limit=100');render('Content Approval',`<div class="panel"><div class="list">${q.items.length?q.items.map(d=>`<div class="item"><strong>${esc(d.title||d.id)}</strong><div class="muted">Draft #${d.id} · ${esc(d.status)}</div><p>${esc(d.body||'')}</p><div class="row"><button class="btn" onclick="decide(${d.id},'approved')">Approve</button><button class="btn danger" onclick="reject(${d.id})">Reject</button></div></div>`).join(''):'<p class="muted">No pending drafts.</p>'}</div></div>`)}else if(current==='schedule'){const q=await api('/schedules?limit=200');render('Schedules',`<div class="panel"><table><thead><tr><th>ID</th><th>Draft</th><th>Provider</th><th>Scheduled</th><th>Status</th></tr></thead><tbody>${q.items.map(s=>`<tr><td>${s.id}</td><td>${s.draft_id}</td><td>${esc(s.provider)}</td><td>${esc(s.scheduled_for)}</td><td>${esc(s.status)}</td></tr>`).join('')}</tbody></table></div>`)}else if(current==='history'){const q=await api('/publishing/history?limit=200');render('Publishing History',`<div class="panel"><table><thead><tr><th>Draft</th><th>Provider</th><th>Status</th><th>External ID</th></tr></thead><tbody>${q.items.map(x=>`<tr><td>${x.draft_id}</td><td>${esc(x.provider)}</td><td>${esc(x.status)}</td><td>${esc(x.external_id||'')}</td></tr>`).join('')}</tbody></table></div>`)}else if(current==='research'){render('Research',`<div class="panel"><h2>Research pipeline</h2><p class="muted">Run configured sources, then analyze discovered problems.</p><div class="row"><button class="btn" onclick="runResearch()">Run research</button><button class="btn secondary" onclick="runAnalysis()">Run AI analysis</button></div></div>`)}else if(current==='system'){await renderSystem()}}catch(e){if(e.message!=='unauthorized')render('Error',`<div class="panel"><p>${esc(e.message)}</p></div>`)}}
async function renderSystem(){const [data,ready]=await Promise.all([api('/system/settings'),api('/ready')]);const s=data.settings,p=data.providers;render('System',`<div class="panel"><div class="section-head"><div><h2>AI & Research Configuration</h2><div class="muted">Configure providers, research sources, publishing credentials and worker behavior without editing files.</div></div><button class="btn" onclick="saveSystem()">Save configuration</button></div><div class="grid2"><div><div class="field"><label>Gemini API key</label><input id="gemini_api_key" type="password" placeholder="${s.gemini_api_key.configured?'Configured — enter a new key to replace it':'Enter API key'}"><div class="help">Used for AI analysis and content generation.</div></div><div class="field"><label>Gemini model</label><input id="gemini_model" value="${esc(s.gemini_model)}"></div><div class="field"><label>Gemini timeout (seconds)</label><input id="gemini_timeout_seconds" type="number" min="1" step="1" value="${esc(s.gemini_timeout_seconds)}"></div><div class="field"><label>RSS research feeds</label><textarea id="rss_feeds">${esc(s.rss_feeds)}</textarea><div class="help">Comma-separated feed URLs.</div></div></div><div><div class="field"><label>Research timeout (seconds)</label><input id="research_timeout_seconds" type="number" min="1" step="1" value="${esc(s.research_timeout_seconds)}"></div><div class="field"><label>Research limit per source</label><input id="research_limit_per_source" type="number" min="1" step="1" value="${esc(s.research_limit_per_source)}"></div><div class="field"><label>Publishing timeout (seconds)</label><input id="publishing_timeout_seconds" type="number" min="1" step="1" value="${esc(s.publishing_timeout_seconds)}"></div><div class="field"><label>Worker poll interval (seconds)</label><input id="worker_poll_seconds" type="number" min="1" step="1" value="${esc(s.worker_poll_seconds)}"></div><div class="field"><label>Worker batch size</label><input id="worker_batch_size" type="number" min="1" step="1" value="${esc(s.worker_batch_size)}"></div></div></div></div><div class="panel"><div class="section-head"><div><h2>Publishing Connections</h2><div class="muted">Credentials are masked in the dashboard. Connection tests never publish content.</div></div></div><div class="provider-grid">${p.map(x=>`<div class="provider"><div class="section-head"><strong>${esc(x.name)}</strong><span class="status ${x.supported&&x.status==='configured'?'ok':x.supported?'':'next'}">${x.status==='configured'?'Configured':x.supported?'Not configured':'Adapter pending'}</span></div>${x.id==='linkedin'?`<div class="field"><label>Access token</label><input id="linkedin_access_token" type="password" placeholder="${s.linkedin_access_token.configured?'Configured — enter a new token to replace it':'Enter access token'}"></div><div class="field"><label>Author URN</label><input id="linkedin_author_urn" value="${esc(s.linkedin_author_urn)}" placeholder="urn:li:person:..."></div><div class="field"><label>LinkedIn API version</label><input id="linkedin_api_version" value="${esc(s.linkedin_api_version)}"></div><div class="row"><button class="btn secondary" onclick="testProvider('linkedin')">Test connection</button></div>`:`<p class="muted">Provider UI is reserved here; its publishing adapter will be added in the platform integration phase.</p>`}</div>`).join('')}</div></div><div class="panel"><div class="section-head"><div><h2>Runtime readiness</h2><div class="muted">Current service health and required configuration.</div></div><button class="btn secondary" onclick="refresh()">Recheck</button></div>${(ready.checks||[]).map(c=>`<div class="item"><strong>${esc(c.name)}</strong><div class="muted">${esc(c.status)}${c.detail?' — '+esc(c.detail):''}</div></div>`).join('')}</div>`)}
function val(id){return $(id)?.value??''}async function saveSystem(){const values={gemini_api_key:val('gemini_api_key'),gemini_model:val('gemini_model'),gemini_timeout_seconds:val('gemini_timeout_seconds'),rss_feeds:val('rss_feeds'),research_timeout_seconds:val('research_timeout_seconds'),research_limit_per_source:val('research_limit_per_source'),publishing_timeout_seconds:val('publishing_timeout_seconds'),worker_poll_seconds:val('worker_poll_seconds'),worker_batch_size:val('worker_batch_size'),linkedin_access_token:val('linkedin_access_token'),linkedin_author_urn:val('linkedin_author_urn'),linkedin_api_version:val('linkedin_api_version')};try{await api('/system/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});toast('System configuration saved successfully.');await renderSystem()}catch(e){toast(e.message)}}async function testProvider(p){const r=await api('/system/test/'+p,{method:'POST'});toast(r.message)}
async function decide(id,a,reason=''){await api('/approval/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,reason})});refresh()}async function reject(id){const reason=prompt('Reason for rejection:');if(reason)decide(id,'rejected',reason)}async function runResearch(){const r=await api('/research/run',{method:'POST'});toast(`Research complete: ${r.saved} saved, ${r.duplicates} duplicates.`);refresh()}async function runAnalysis(){const r=await api('/analysis/run',{method:'POST'});toast(`Analysis complete: ${r.analyzed} analyzed.`);refresh()}async function generateContent(){const r=await api('/content/generate',{method:'POST'});toast(`Generated ${r.generated??0} drafts.`);refresh()}
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.view;refresh()});$('logout').onclick=async()=>{await fetch('/dashboard/logout',{method:'POST'});showLogin()};$('signInTab').onclick=()=>setAuthMode(false);$('signUpTab').onclick=()=>setAuthMode(true,'Create your first admin account.');$('loginForm').onsubmit=login;
setAuthMode(signup,signup?'Welcome! Create your admin username and password to begin.':'');if(!configured)showLogin('Dashboard is not configured.');else if(authenticated){showApp();refresh()}else showLogin();
</script></body></html>
