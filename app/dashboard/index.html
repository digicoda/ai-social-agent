<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Social Agent</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}.side{width:240px;background:#101828;color:#fff;padding:24px 16px}.brand{font-weight:800;font-size:19px;padding:8px 10px 24px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#b9c2d0;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}.main{flex:1;padding:28px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:26px}.muted{color:#667085}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:18px}.metric{font-size:28px;font-weight:800;margin-top:8px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:20px;margin-top:20px}.panel h2{margin-top:0;font-size:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600;background:#175cd3;color:#fff}.btn.secondary{background:#eef2f6;color:#344054}.btn.danger{background:#d92d20}.list{display:grid;gap:10px}.item{border:1px solid #eaecf0;border-radius:10px;padding:14px}.item strong{display:block;margin-bottom:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eaecf0;font-size:13px}input{padding:11px;border:1px solid #d0d5dd;border-radius:8px}.hidden{display:none}.login{max-width:420px;margin:12vh auto;background:#fff;padding:30px;border:1px solid #e4e7ec;border-radius:14px}.login h1{margin-top:0}.login label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}.login input{width:100%}.notice{padding:12px;border-radius:8px;background:#fff4e5;color:#8a4b08;margin-bottom:16px}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}.side{width:auto}.main{padding:16px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="login" class="login hidden">
  <h1>AI Social Agent</h1><p class="muted">Admin dashboard</p>
  <div id="loginNotice" class="notice hidden"></div>
  <form id="loginForm"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" style="margin-top:18px;width:100%">Sign in</button></form>
</div>
<div id="app" class="shell hidden">
  <aside class="side"><div class="brand">AI Social Agent</div><nav class="nav"><button data-view="overview" class="active">Overview</button><button data-view="research">Research</button><button data-view="approval">Content Approval</button><button data-view="schedule">Schedules</button><button data-view="history">Publishing History</button><button data-view="system">System</button><button id="logout">Sign out</button></nav></aside>
  <main class="main"><div class="top"><div><h1 id="title">Overview</h1><div class="muted">Research, approve, schedule and publish.</div></div><button class="btn secondary" onclick="refresh()">Refresh</button></div><section id="content"></section></main>
</div>
<script>
const configured=__AUTH_CONFIGURED__; const authenticated=__AUTHENTICATED__;
const $=id=>document.getElementById(id); let current='overview';
function showLogin(message=''){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); if(message){$('loginNotice').textContent=message;$('loginNotice').classList.remove('hidden')} }
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }
async function login(e){e.preventDefault();const r=await fetch('/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});if(r.ok){showApp();refresh()}else showLogin('Invalid credentials.');}
async function api(url,opts={}){const r=await fetch(url,opts);if(r.status===401){showLogin('Your session expired.');throw new Error('unauthorized')}if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function render(title,html){$('title').textContent=title;$('content').innerHTML=html}
async function refresh(){try{if(current==='overview'){const [stats,approval,schedules]=await Promise.all([api('/publishing/stats'),api('/approval/queue?limit=5'),api('/schedules?limit=5')]);render('Overview',`<div class="cards"><div class="card"><div class="muted">Published</div><div class="metric">${stats.published??0}</div></div><div class="card"><div class="muted">Failed</div><div class="metric">${stats.failed??0}</div></div><div class="card"><div class="muted">Pending approval</div><div class="metric">${approval.items.length}</div></div><div class="card"><div class="muted">Schedules</div><div class="metric">${schedules.items.length}</div></div></div><div class="panel"><h2>Next actions</h2><div class="row"><button class="btn" onclick="runResearch()">Run research</button><button class="btn secondary" onclick="generateContent()">Generate content</button><button class="btn secondary" onclick="current='approval';refresh()">Review approval queue</button></div></div>`)}else if(current==='approval'){const q=await api('/approval/queue?limit=100');render('Content Approval',`<div class="panel"><div class="list">${q.items.length?q.items.map(d=>`<div class="item"><strong>${esc(d.title||d.id)}</strong><div class="muted">Draft #${d.id} · ${esc(d.status)}</div><p>${esc(d.body||'')}</p><div class="row"><button class="btn" onclick="decide(${d.id},'approved')">Approve</button><button class="btn danger" onclick="reject(${d.id})">Reject</button></div></div>`).join(''):'<p class="muted">No pending drafts.</p>'}</div></div>`)}else if(current==='schedule'){const q=await api('/schedules?limit=200');render('Schedules',`<div class="panel"><table><thead><tr><th>ID</th><th>Draft</th><th>Provider</th><th>Scheduled</th><th>Status</th></tr></thead><tbody>${q.items.map(s=>`<tr><td>${s.id}</td><td>${s.draft_id}</td><td>${esc(s.provider)}</td><td>${esc(s.scheduled_for)}</td><td>${esc(s.status)}</td></tr>`).join('')}</tbody></table></div>`)}else if(current==='history'){const q=await api('/publishing/history?limit=200');render('Publishing History',`<div class="panel"><table><thead><tr><th>Draft</th><th>Provider</th><th>Status</th><th>External ID</th></tr></thead><tbody>${q.items.map(x=>`<tr><td>${x.draft_id}</td><td>${esc(x.provider)}</td><td>${esc(x.status)}</td><td>${esc(x.external_id||'')}</td></tr>`).join('')}</tbody></table></div>`)}else if(current==='research'){render('Research',`<div class="panel"><h2>Research pipeline</h2><p class="muted">Run the configured sources, then analyze discovered problems.</p><div class="row"><button class="btn" onclick="runResearch()">Run research</button><button class="btn secondary" onclick="runAnalysis()">Run AI analysis</button></div><div id="result" class="panel hidden"></div></div>`)}else if(current==='system'){const r=await api('/ready');render('System',`<div class="panel"><h2>Readiness</h2><p><strong>${esc(r.status)}</strong></p>${(r.checks||[]).map(c=>`<div class="item"><strong>${esc(c.name)}</strong><span class="muted">${esc(c.status)}${c.detail?` — ${esc(c.detail)}`:''}</span></div>`).join('')}</div>`)} }catch(e){if(e.message!=='unauthorized')render('Error',`<div class="panel"><p>${esc(e.message)}</p></div>`)} }
async function decide(id,action,reason=''){await api('/approval/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,reason})});refresh()}
async function reject(id){const reason=prompt('Reason for rejection:');if(reason)decide(id,'rejected',reason)}
async function runResearch(){const r=await api('/research/run',{method:'POST'});alert(`Research complete: ${r.saved} saved, ${r.duplicates} duplicates.`);refresh()}
async function runAnalysis(){const r=await api('/analysis/run',{method:'POST'});alert(`Analysis complete: ${r.analyzed} analyzed.`);refresh()}
async function generateContent(){const r=await api('/content/generate',{method:'POST'});alert(`Generated ${r.generated??0} drafts.`);refresh()}
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.view;refresh()});$('logout').onclick=async()=>{await fetch('/dashboard/logout',{method:'POST'});showLogin()};$('loginForm').onsubmit=login;
if(!configured) showLogin('Dashboard credentials are not configured. Set ADMIN_USERNAME, ADMIN_PASSWORD and SESSION_SECRET.'); else if(authenticated){showApp();refresh()} else showLogin();
</script>
</body>
</html>
