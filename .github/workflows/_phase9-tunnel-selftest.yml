name: Phase 9 Tunnel Self-Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tunnel-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: ai-social-agent-phase9-selftest
      ADMIN_USERNAME: test-admin
      ADMIN_PASSWORD: phase9-self-test-password
      APP_ENV: development
      SESSION_SECRET: phase9-self-test-session-secret
      INTERNAL_API_KEY: phase9-self-test-api-key
      WORKER_POLL_SECONDS: "5"
      DATABASE_URL: sqlite:///./data/ai_social_agent.db
      GEMINI_API_KEY: ""
      LINKEDIN_ACCESS_TOKEN: ""
      LINKEDIN_AUTHOR_URN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and start API and worker
        run: docker compose up -d --build

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Start and validate Quick Tunnel
        shell: bash
        run: |
          docker pull cloudflare/cloudflared:latest
          docker run -d --rm --name ai-social-agent-tunnel --network host \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate --url http://127.0.0.1:8000

          : > /tmp/cloudflared.log
          url=""
          for attempt in $(seq 1 45); do
            docker logs ai-social-agent-tunnel > /tmp/cloudflared.log 2>&1 || true
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$url" ]; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' ai-social-agent-tunnel 2>/dev/null | grep -q true; then
              cat /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done

          if [ -z "$url" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "Quick Tunnel URL: $url"
          curl --fail --silent --show-error "$url/health"
          echo
          curl --fail --silent --show-error "$url/dashboard/login" | grep -q 'Sign in'
          echo "Public dashboard route is reachable through the tunnel."

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ai-social-agent-tunnel >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans || true
