name: Windows Desktop Installer

on:
  push:
    branches: [main, 'v1.2.2']
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'windows/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'windows/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/AI-Social-Agent.iss
          options: /O+

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: AI-Social-Agent-Windows-Installer
          path: installer/output/AI-Social-Agent-Setup.exe
          if-no-files-found: error
          retention-days: 7

  publish-v1-2-2:
    if: github.ref == 'refs/heads/v1.2.2' && github.event_name == 'push'
    needs: build-installer
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: AI-Social-Agent-Windows-Installer
          path: release

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/AI-Social-Agent-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AI-Social-Agent-Setup.exe" | Set-Content release/AI-Social-Agent-Setup.exe.sha256

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.2 release/AI-Social-Agent-Setup.exe release/AI-Social-Agent-Setup.exe.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AI Social Agent v1.2.2" --notes "Windows Desktop v1.2.2. In-place upgrade, persistent ProgramData preservation, hardened process shutdown, and System → Check & Update flow."
