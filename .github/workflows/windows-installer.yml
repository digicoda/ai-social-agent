name: Windows Desktop Installer

on:
  push:
    branches: [main, 'v1.2.2']
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'windows/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'windows/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Generate branded Windows icon
        shell: pwsh
        run: python windows/generate_icon.py
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1
      - name: Verify installer and icon payload
        shell: pwsh
        run: ./installer/verify.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Social-Agent-Windows-Installer
          path: installer/dist/AI-Social-Agent-Setup.exe
          if-no-files-found: error
