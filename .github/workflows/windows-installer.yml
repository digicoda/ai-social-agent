name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'windows/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'windows/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/AI-Social-Agent.iss
          options: /O+

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: AI-Social-Agent-Windows-Installer
          path: installer/output/AI-Social-Agent-Setup.exe
          if-no-files-found: error
          retention-days: 7
