name: GitHub Interactive Manual Test

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long to keep the temporary environment alive"
        required: true
        default: "20"
        type: choice
        options:
          - "10"
          - "20"
          - "30"

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: ai-social-agent-manual
  ADMIN_USERNAME: test-admin
  APP_ENV: development
  SESSION_SECRET: github-manual-test-session-secret
  INTERNAL_API_KEY: github-manual-test-api-key
  WORKER_POLL_SECONDS: "5"
  DURATION_MINUTES: ${{ inputs.duration_minutes }}

jobs:
  interactive-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate temporary dashboard password
        id: credentials
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          printf 'ADMIN_PASSWORD=%s\n' "$password" > .env
          printf 'ADMIN_USERNAME=%s\n' "$ADMIN_USERNAME" >> .env
          printf 'APP_ENV=%s\n' "$APP_ENV" >> .env
          printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET" >> .env
          printf 'INTERNAL_API_KEY=%s\n' "$INTERNAL_API_KEY" >> .env
          printf 'WORKER_POLL_SECONDS=%s\n' "$WORKER_POLL_SECONDS" >> .env
          printf 'DATABASE_URL=sqlite:///./data/ai_social_agent.db\n' >> .env
          printf 'GEMINI_API_KEY=\n' >> .env
          printf 'LINKEDIN_ACCESS_TOKEN=\n' >> .env
          printf 'LINKEDIN_AUTHOR_URN=\n' >> .env

      - name: Build and start API and worker
        run: docker compose up -d --build

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify protected readiness endpoint
        run: |
          curl --fail --silent \
            -H "X-API-Key: $INTERNAL_API_KEY" \
            http://127.0.0.1:8000/ready | tee /tmp/readiness.json

      - name: Start temporary public tunnel
        id: tunnel
        shell: bash
        run: |
          docker pull cloudflare/cloudflared:latest
          docker run -d --rm --name ai-social-agent-tunnel --network host \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate --url http://127.0.0.1:8000

          : > /tmp/cloudflared.log
          for attempt in $(seq 1 45); do
            docker logs ai-social-agent-tunnel > /tmp/cloudflared.log 2>&1 || true
            url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$url" ]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "Temporary tunnel ready: $url"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' ai-social-agent-tunnel 2>/dev/null | grep -q true; then
              echo 'cloudflared exited before publishing a Quick Tunnel URL.'
              cat /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done

          echo 'Timed out waiting for the Quick Tunnel URL.'
          cat /tmp/cloudflared.log
          exit 1

      - name: Publish LIVE dashboard access details
        shell: bash
        env:
          TEST_PASSWORD: ${{ steps.credentials.outputs.password }}
          TEST_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo
          echo '============================================================'
          echo 'LIVE TEMPORARY DASHBOARD ACCESS'
          echo '============================================================'
          echo "Dashboard: ${TEST_URL}/dashboard"
          echo "Username:  ${ADMIN_USERNAME}"
          echo "Password:  ${TEST_PASSWORD}"
          echo "Expires:   after ${DURATION_MINUTES} minutes"
          echo 'IMPORTANT: use this URL while this workflow is running.'
          echo 'The Cloudflare Quick Tunnel is destroyed during workflow cleanup.'
          echo '============================================================'
          echo "::notice title=Dashboard ready::${TEST_URL}/dashboard is live now. Open this job's logs to see the temporary credentials."

          {
            echo '# Interactive GitHub test environment'
            echo
            echo 'The environment is temporary and will be destroyed when this workflow ends.'
            echo
            echo "**Dashboard:** ${TEST_URL}/dashboard"
            echo "**Username:** ${ADMIN_USERNAME}"
            echo "**Password:** ${TEST_PASSWORD}"
            echo
            echo '## Safe testing scope'
            echo '- LinkedIn credentials are intentionally empty.'
            echo '- Use the dashboard to test login, research, analysis, content generation, approval, scheduling, and worker behavior.'
            echo '- Do not treat this URL as a production endpoint.'
            echo '- The public tunnel URL is temporary and changes on every run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Monitor dashboard and tunnel during manual test
        shell: bash
        env:
          TEST_URL: ${{ steps.tunnel.outputs.url }}
          TEST_PASSWORD: ${{ steps.credentials.outputs.password }}
        run: |
          end_time=$((SECONDS + DURATION_MINUTES * 60))
          check_count=0
          while [ "$SECONDS" -lt "$end_time" ]; do
            if ! docker inspect -f '{{.State.Running}}' ai-social-agent-tunnel 2>/dev/null | grep -q true; then
              echo '::error title=Cloudflare tunnel stopped::cloudflared stopped before the manual test ended.'
              docker logs ai-social-agent-tunnel 2>&1 || true
              exit 1
            fi

            # Verify the public route periodically. Three quick retries avoid
            # failing the manual test on a single transient network request.
            if [ $((check_count % 4)) -eq 0 ]; then
              healthy=0
              for retry in 1 2 3; do
                if curl --fail --silent --show-error --max-time 10 "${TEST_URL}/dashboard" >/dev/null; then
                  healthy=1
                  break
                fi
                sleep 2
              done
              if [ "$healthy" -ne 1 ]; then
                echo '::error title=Dashboard tunnel health check failed::The temporary public dashboard stopped responding. Check cloudflared logs below.'
                docker logs ai-social-agent-tunnel 2>&1 || true
                exit 1
              fi
              echo "Dashboard tunnel health check OK (${check_count})"
            fi

            check_count=$((check_count + 1))
            sleep 5
          done
          echo "Manual test window completed successfully: ${DURATION_MINUTES} minutes."

      - name: Collect test logs
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color > manual-test-compose.log 2>&1 || true
          docker logs ai-social-agent-tunnel > manual-test-tunnel.log 2>&1 || true

      - name: Upload temporary test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: github-manual-test-logs
          path: |
            manual-test-compose.log
            manual-test-tunnel.log
          retention-days: 1

      - name: Tear down temporary environment
        if: always()
        run: |
          docker rm -f ai-social-agent-tunnel >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans || true
