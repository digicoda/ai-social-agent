name: Temporary GitHub Test

on:
  workflow_dispatch:
    inputs:
      keep_seconds:
        description: "How long to keep the temporary stack running after smoke tests"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: temporary-github-test
  cancel-in-progress: true

jobs:
  temporary-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temporary environment
        run: |
          INTERNAL_API_KEY="$(openssl rand -hex 24)"
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          {
            echo "APP_ENV=development"
            echo "DATABASE_URL=sqlite:///./data/ai_social_agent.db"
            echo "INTERNAL_API_KEY=$INTERNAL_API_KEY"
            echo "ADMIN_USERNAME=ci-admin"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "WORKER_POLL_SECONDS=5"
          } > .env
          {
            echo "INTERNAL_API_KEY=$INTERNAL_API_KEY"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Start API and worker
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Validate health and readiness
        run: |
          test "$(curl --fail --silent http://127.0.0.1:8000/health | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "ok"
          test "$(curl --fail --silent -H "X-API-Key: $INTERNAL_API_KEY" http://127.0.0.1:8000/ready | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "ready"

      - name: Validate dashboard session login
        run: |
          curl --fail --silent -c cookies.txt \
            -X POST http://127.0.0.1:8000/dashboard/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"ci-admin\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | grep -q '"authenticated":true'
          curl --fail --silent -b cookies.txt http://127.0.0.1:8000/approval/queue \
            | python -c 'import json,sys; assert isinstance(json.load(sys.stdin)["items"], list)'

      - name: Validate worker container
        run: docker compose ps --status running | grep -q 'worker'

      - name: Hold temporary environment
        if: ${{ inputs.keep_seconds != '' && inputs.keep_seconds != '0' }}
        run: sleep "${{ inputs.keep_seconds }}"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p .ci-artifacts
          docker compose ps > .ci-artifacts/compose-ps.txt || true
          docker compose logs --no-color > .ci-artifacts/compose.log || true

      - name: Upload temporary test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-github-test-logs-${{ github.run_id }}
          path: .ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down temporary environment
        if: always()
        run: docker compose down -v --remove-orphans
